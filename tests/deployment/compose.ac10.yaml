name: restricted-runtime-ac10

services:
  postgres:
    image: postgres:16.10-bookworm
    environment:
      POSTGRES_DB: restricted_runtime_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: SYNTHETIC_NON_PHI_ONLY_AC10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d restricted_runtime_test"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql/data

  tests:
    image: python:3.11-slim
    user: "0:0"
    working_dir: /workspace
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      RESTRICTED_RUNTIME_TEST_DATABASE_URL: postgresql://postgres:SYNTHETIC_NON_PHI_ONLY_AC10@postgres:5432/restricted_runtime_test
    volumes:
      - ../..:/workspace:ro
    tmpfs:
      - /run
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
