events {}
http {
  access_log off;
  error_log /dev/stderr warn;
  server {
    listen 8443 ssl;
    server_name hrh-tls;
    ssl_certificate /run/hrh-tls/server.crt;
    ssl_certificate_key /run/hrh-tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
      proxy_pass http://hrh:8080;
      proxy_set_header Host hrh-tls;
      proxy_set_header Connection close;
      proxy_http_version 1.1;
    }
  }
}
