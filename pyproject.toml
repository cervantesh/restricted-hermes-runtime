[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "restricted-hermes-runtime"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42,<45",
  "fastapi>=0.115,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "PyYAML>=6,<7",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "httpx>=0.27,<1"]
google = ["google-auth>=2.35,<3", "google-cloud-kms>=3.5,<4", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
