name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-contracts:
    name: Python ${{ matrix.python-version }} contracts
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[test,google]"
      - name: Run unit, static, API, and integration contracts
        run: python -m pytest tests/unit tests/static tests/api tests/integration

  synthetic-linux-e2e:
    name: Synthetic-only Linux and container E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[test,google]"
      - name: Prove role-specific container closure
        run: python -m pytest tests/container
      - name: Run synthetic-only composed runtime
        env:
          RESTRICTED_SYNTHETIC_TMP_ROOT: /tmp
        run: bash tests/deployment/test_local_compose_e2e.sh "gha${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
